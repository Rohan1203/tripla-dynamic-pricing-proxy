development:
  host: <%= ENV['REDIS_HOST'] || localhost%>
  port: 6379
  password: <%= ENV['REDIS_PASSWORD'] %>
  db: 0
  timeout: 5
  pool_size: 5
  pool_timeout: 5
  # rate_ttl: <%= ENV['REDIS_RATE_TTL'] || 300 %>  # 5 minutes default
  # default_ttl: <%= ENV['REDIS_DEFAULT_TTL'] || 3600 %>  # 1 hour default

test:
  host: <%= ENV['REDIS_HOST'] || localhost %>
  port: 6379
  password: <%= ENV['REDIS_PASSWORD'] %>
  db: 1
  timeout: 5
  pool_size: 5
  pool_timeout: 5
  # rate_ttl: <%= ENV['REDIS_RATE_TTL'] || 300 %>
  # default_ttl: <%= ENV['REDIS_DEFAULT_TTL'] || 3600 %>

production:
  host: <%= ENV['REDIS_HOST'] || 'redis' %>
  port: <%= ENV['REDIS_PORT'] || 6379 %>
  password: <%= ENV['REDIS_PASSWORD'] %>
  db: 0
  timeout: 5
  pool_size: 10
  pool_timeout: 5
  reconnect_attempts: 3
  # rate_ttl: <%= ENV['REDIS_RATE_TTL'] || 300 %>
  # default_ttl: <%= ENV['REDIS_DEFAULT_TTL'] || 3600 %>
