name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dynamic-pricing

    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t interview-app .

      - name: Run Rails tests
        run: |
          docker run --rm \
            -e RAILS_ENV=test \
            interview-app \
            bin/rails test

      - name: Start application container
        run: |
          docker run -d \
            -p 3000:3000 \
            --name interview-runtime \
            interview-app

      - name: Wait for app to boot
        run: |
          echo "Waiting for server..."
          for i in {1..10}; do
            if curl -s http://localhost:3000/health > /dev/null; then
              echo "✅ Server is up"
              exit 0
            fi
            sleep 3
          done
          echo "❌ Server failed to start"
          exit 1

      - name: Test pricing endpoint
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            'http://localhost:3000/pricing?period=Summer&hotel=FloatingPointResort&room=SingletonRoom')

          echo "HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Pricing API failed"
            exit 1
          fi

          echo "✅ Pricing API returned 200"

      - name: Cleanup containers
        if: always()
        run: docker rm -f interview-runtime
